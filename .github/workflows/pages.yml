name: Validate static site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-static-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Test site
        run: npm test

      - name: Verify static output
        run: |
          test -f dist/client/index.html
          test -d dist/client/SchoolPrision/_next/static
          test -d dist/client/characters
          test -d dist/client/pv
          ! grep -qE '(src|href)="/(pv|characters)/' dist/client/index.html
